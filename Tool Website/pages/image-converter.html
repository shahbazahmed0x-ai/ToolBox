<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Format Converter — ToolBox</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="navbar">
  <div class="container nav-inner">
    <a href="../index.html" class="logo">🧰 ToolBox</a>
    <nav id="navLinks" class="nav-links">
      <a href="../index.html">Home</a>
      <a href="image-to-pdf.html">Image to PDF</a>
      <a href="image-converter.html">Image Converter</a>
      <a href="pdf-editor.html">PDF Editor</a>
    </nav>
    <button id="navToggle" class="nav-toggle">☰</button>
  </div>
</header>

<div class="page-header container">
  <h1>🔄🖼️ Image Format Converter</h1>
  <p>Convert images to PNG, JPEG, or WEBP. Resize and compress in bulk.</p>
</div>

<div class="container">
<div class="tool-layout">

  <div class="panel">
    <div class="dropzone" id="dropZone">
      <div class="dz-icon">📤</div>
      <p><strong>Click to upload</strong> or drag & drop images here</p>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>
    <div id="fileList" style="margin-top:16px;"></div>
    <div style="display:flex;gap:10px;margin-top:10px;">
      <button class="btn btn-outline" id="clearBtn">Clear All</button>
      <button class="btn btn-primary" id="convertBtn" disabled>Convert</button>
    </div>

    <div id="results" class="hidden" style="margin-top:24px;">
      <h3 style="margin-bottom:10px;">Converted Files</h3>
      <div id="resultsList"></div>
      <button class="btn btn-outline hidden" id="downloadAllBtn">⬇ Download All as ZIP</button>
    </div>
  </div>

  <div class="panel">
    <h3>⚙️ Settings</h3>
    <div class="field">
      <label>Output Format</label>
      <select id="format">
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPEG</option>
        <option value="image/webp">WEBP</option>
      </select>
    </div>
    <div class="field">
      <label>Quality: <span id="qualityVal">85%</span></label>
      <input type="range" id="quality" min="10" max="100" value="85">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Width (px)</label>
        <input type="number" id="widthInput" placeholder="auto">
      </div>
      <div class="field">
        <label>Height (px)</label>
        <input type="number" id="heightInput" placeholder="auto">
      </div>
    </div>
    <div class="checkbox-field">
      <input type="checkbox" id="aspectCheck" checked>
      <label for="aspectCheck">Maintain aspect ratio</label>
    </div>
  </div>

</div>
</div>

<footer class="footer"><div class="container"><p>© <span id="year"></span> ToolBox</p></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="../js/main.js"></script>
<script src="../js/image-converter.js"></script>
</body>
</html>
