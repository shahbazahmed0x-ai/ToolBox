<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to PDF Converter — ToolBox</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="navbar">
  <div class="container nav-inner">
    <a href="../index.html" class="logo">🧰 ToolBox</a>
    <nav id="navLinks" class="nav-links">
      <a href="../index.html">Home</a>
      <a href="image-to-pdf.html">Image to PDF</a>
      <a href="image-converter.html">Image Converter</a>
      <a href="pdf-editor.html">PDF Editor</a>
    </nav>
    <button id="navToggle" class="nav-toggle">☰</button>
  </div>
</header>

<div class="page-header container">
  <h1>🖼️➡️📄 Image to PDF Converter</h1>
  <p>Upload images, arrange them, customize layout, and generate a single PDF file.</p>
</div>

<div class="container">
<div class="tool-layout">

  <div class="panel">
    <div class="dropzone" id="dropZone">
      <div class="dz-icon">📤</div>
      <p><strong>Click to upload</strong> or drag & drop images here</p>
      <p style="font-size:.8rem;">Supports JPG, PNG, WEBP, GIF, BMP</p>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>

    <div class="thumbs" id="thumbs"></div>
    <div style="display:flex;gap:10px;margin-top:10px;">
      <button class="btn btn-outline" id="clearBtn">Clear All</button>
      <button class="btn btn-primary" id="generateBtn" disabled>Generate PDF</button>
    </div>
    <p class="status-text" id="status"></p>
  </div>

  <div class="panel">
    <h3>⚙️ Settings</h3>

    <div class="field">
      <label>Page Size</label>
      <select id="pageSize">
        <option value="a4">A4</option>
        <option value="letter">Letter</option>
        <option value="legal">Legal</option>
        <option value="fit">Fit to Image</option>
      </select>
    </div>

    <div class="field">
      <label>Orientation</label>
      <select id="orientation">
        <option value="auto">Auto (based on image)</option>
        <option value="portrait">Portrait</option>
        <option value="landscape">Landscape</option>
      </select>
    </div>

    <div class="field">
      <label>Image Fit Mode</label>
      <select id="fitMode">
        <option value="contain">Contain (fit inside page)</option>
        <option value="cover">Cover (fill page, may crop)</option>
        <option value="stretch">Stretch (fill exactly)</option>
      </select>
    </div>

    <div class="field">
      <label>Margin (mm)</label>
      <input type="number" id="margin" value="10" min="0" max="50">
    </div>

    <div class="field">
      <label>Image Quality: <span id="qualityVal">85%</span></label>
      <input type="range" id="quality" min="10" max="100" value="85">
    </div>
  </div>

</div>
</div>

<footer class="footer"><div class="container"><p>© <span id="year"></span> ToolBox</p></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script src="../js/main.js"></script>
<script src="../js/image-to-pdf.js"></script>
</body>
</html>
